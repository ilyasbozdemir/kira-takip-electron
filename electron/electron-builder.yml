appId: com.isletmetakip.app
productName: İşletmeTakipAppPro
directories:
  output: release/${version}
files:
  - dist/**/*
  - dist-electron/**/*
fileAssociations:
  - ext: vke
    name: Isletme Takip Enterprise Document
    description: İşletme & Salon Kiralama Takip Çalışma Dosyası
    icon: build/icon.ico
    role: Editor

win:
  target:
    - nsis
  icon: build/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: İşletmeTakipAppPro
  include: build/installer.nsh

publish:
  provider: github
  owner: ilyasbozdemir
  repo: kira-takip-electron
