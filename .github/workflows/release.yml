name: Release VenueKeeper App Pro

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Desktop Executable
        run: pnpm run build:vite && npx electron-builder --win --config electron/electron-builder.yml --publish never

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = Get-ChildItem -Path release -Recurse -Include *.exe,*.blockmap,latest.yml | Select-Object -ExpandProperty FullName
          if (gh release view ${{ github.ref_name }} 2>$null) {
            gh release upload ${{ github.ref_name }} $files --clobber
          } else {
            gh release create ${{ github.ref_name }} $files --title "${{ github.ref_name }}" --prerelease --generate-notes
          }
