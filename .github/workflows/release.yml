name: Release İşletmeTakipAppPro

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Rebuild Native Modules for Electron
        run: pnpm run rebuild

      - name: Build and Publish Desktop Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm run build:vite
          npx electron-builder --win --config electron/electron-builder.yml --publish always

      - name: Ensure Release is Published (Not Draft) and Set as Latest
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Start-Sleep -Seconds 10
          gh release edit ${{ github.ref_name }} --draft=false --latest

