name: Release İşletmeTakipAppPro

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Rebuild Native Modules for Electron
        run: pnpm run rebuild

      - name: Build Desktop Executable
        run: pnpm run build:vite && npx electron-builder --win --config electron/electron-builder.yml --publish never

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = Get-ChildItem -Path release -Recurse -Include *.exe,*.blockmap,latest.yml,*.zip | Where-Object { $_.FullName -notmatch "win-unpacked" -and $_.FullName -notmatch "__uninstaller" -and $_.Name -ne "elevate.exe" -and $_.Name -ne "IsletmeTakipAppPro.exe" } | Select-Object -ExpandProperty FullName
          if (gh release view ${{ github.ref_name }} 2>$null) {
            gh release upload ${{ github.ref_name }} $files --clobber
            gh release edit ${{ github.ref_name }} --draft=false --prerelease=false --latest
          } else {
            gh release create ${{ github.ref_name }} $files --title "${{ github.ref_name }}" --draft=false --prerelease=false --latest --generate-notes
          }

      - name: Retain Only Latest 5 Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $allReleases = (gh release list -L 100 | ForEach-Object { ($_ -split "`t")[0] })
          if ($allReleases.Count -gt 5) {
            $toDelete = $allReleases | Select-Object -Skip 5
            foreach ($rel in $toDelete) {
              Write-Host "Auto-cleaning old release beyond top 5: $rel"
              gh release delete $rel -y --cleanup-tag 2>$null
            }
          }

