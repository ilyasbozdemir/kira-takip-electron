name: Release İşletmeTakipAppPro

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Rebuild Native Modules for Electron
        run: pnpm run rebuild

      - name: Build and Publish Desktop Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm run build:vite
          npx electron-builder --win --config electron/electron-builder.yml --publish always

      - name: Ensure Release is Published (Not Draft) and Set as Latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Start-Sleep -Seconds 5
          gh release edit ${{ github.ref_name }} --draft=false --latest


      - name: Retain Only Latest 5 Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $allTags = @(gh release list -L 100 --json tagName -q '.[].tagName')
          if ($allTags.Count -gt 5) {
            $toDelete = $allTags | Select-Object -Skip 5
            foreach ($tag in $toDelete) {
              if ($tag) {
                Write-Host "Auto-cleaning old release beyond top 5: $tag"
                gh release delete $tag -y --cleanup-tag 2>$null
              }
            }
          }

